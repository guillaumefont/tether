name: Builds

# Exports the game for Web and Android on every push.
# - Web build and APK are published to the gh-pages branch, so with GitHub Pages
#   turned on (Settings > Pages > Deploy from a branch > gh-pages) you get:
#     https://<owner>.github.io/<repo>/                 play in a browser
#     https://<owner>.github.io/<repo>/pivot-rush.apk   install on Android
# - The APK is also attached to each run as an artifact.
on:
  push:
    branches: [main, claude/godot-3d-port]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builds
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache export templates
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-web-android

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot" && rm godot.zip

      - name: Download export templates
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz 'templates/web_nothreads_*' 'templates/android_*' 'templates/version.txt'
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && mv templates/* "$dest/" && rm -rf tpl.tpz templates

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android signing (debug keystore) and editor settings
        run: |
          ks="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$ks" -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$ks"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        run: $RUNNER_TEMP/godot --headless --path . --import

      - name: Export Web
        run: |
          mkdir -p build/web
          $RUNNER_TEMP/godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.wasm

      - name: Export Android (debug-signed APK)
        run: |
          mkdir -p build/android
          $RUNNER_TEMP/godot --headless --path . --export-debug Android build/android/pivot-rush.apk
          test -s build/android/pivot-rush.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pivot-rush-apk
          path: build/android/pivot-rush.apk

      - name: Publish to gh-pages
        run: |
          mkdir -p build/pages
          cp -r build/web/. build/pages/
          cp build/android/pivot-rush.apk build/pages/
          touch build/pages/.nojekyll
          cd build/pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
